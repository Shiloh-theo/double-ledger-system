spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/your_db
    username: your_db_username
    password: your_db_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080